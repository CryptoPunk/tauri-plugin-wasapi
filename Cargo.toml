[package]
name = "tauri-plugin-wasapi"
version = "0.1.0"
authors = [ "Max Vohra <max-oss@seattlenetworks.com>" ]
description = "Tauri plugin for WASAPI audio capture from devices and applications"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-wasapi"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
sysinfo = "0.38"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
